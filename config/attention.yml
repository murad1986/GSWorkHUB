# Правила экрана внимания. Это ГИПОТЕЗА, а не закон: меняется настройкой этого
# файла, без правок кода. Сборка пишет только факт вычисления; реальный показ
# фиксирует `today`, а ответ человека — `workflow`. Иначе технический запуск
# притворялся бы использованием и портил самоанализ.

limit: 7            # больше — показать худшие и строку «ещё N»
stuck_top: 5        # сколько самых застоявшихся показывать

# Срок «близко» — за сколько дней до даты обещание попадает в экран
due_soon_days: 3

# Через сколько дней без движения позиция считается застоявшейся.
# Возраст берётся от события (поля opened/created/date или дата origin),
# а не от даты файла: перенос склада иначе обнулил бы весь возраст.
stale_days:
  commitment: 14
  question: 21
  goal: 30          # цель, к которой месяц не привязано ни одного шага
  risk: 60
  spec: 90
  idea: 180
  idea_without_hypothesis: 90   # замысел без проверки — пока мнение
  reading: 30       # начатая книга без движения; очередь не стареет вообще

# Режимы контейнеров, чьи позиции стареют и попадают в экран
aging_modes: [active]

# --- Приём ---
# Сырьё приходит без полей, которые может проставить только разбор: контейнер,
# участник, режим разговора. Требовать их на входе — требовать результат
# разбора до разбора. Мягкая мерка действует в зоне приёма и только там: список
# знакомых программ был бы дырой, которая расширяется с каждой новой программой.
intake:
  zone: raw/inbox       # мягкая мерка действует здесь — место объявляет сорт
  pending_days: 3       # через сколько дней неразобранное просится в экран

# --- Похожие позиции ---
# Мера лексическая: ловит пересказ, не ловит синонимы. Порог подобран по живому
# складу — там максимум сходства среди заведомо разных позиций 0,14, а среди
# заведомо одинаковых начинается с 0,29. Всегда замечание, никогда нарушение:
# совпадение слов не доказывает, что дело одно, и судить человеку.
duplicates:
  threshold: 0.35             # позиции из разных источников
  same_origin_threshold: 0.25 # из одного события — общий источник сам по себе довод

# --- Трекер ---
tracker:
  wip_limit: 3          # одновременно в работе (Kanban): больше — не берём новое
  self_slot: true       # одно место из лимита всегда за work/me — «сначала заплати себе»
  candidates: 3         # сколько вариантов предлагать на выбор, а не назначать
  pickup_window_days: 7 # в каком окне искать вероятно сделанное
  max_active_containers: 3  # живых контуров больше — сигнал перегрева (профиль: work/me/profil.md)

# --- Решения ---
# Стиль решений по профилю — зависание: проверка лучшего варианта не кончается
# сама. У решения есть вес, у веса — срок в днях; подвешенное дольше срока
# поднимается строкой «пора решать». Вес пишется полем weight у решения,
# без поля берётся default_weight.
decisions:
  timebox_days:
    small: 1            # мелкое обратимое — решается в тот же день
    medium: 2           # среднее продуктовое — сутки-двое и короткая записка
    large: 5            # крупное рискованное — до недели и один эксперт, не пять
  default_weight: medium

# --- Анализ без действия ---
# «Умная прокрастинация» из профиля: ещё ресёрч, ещё схема, ещё разбор — а
# наружу ничего. След в складе: по контейнеру прибавляются вопросы и разборы,
# но ни одно обязательство не закрывается. Сигнал — наблюдение с вопросом,
# не вердикт.
analysis_drift:
  window_days: 14
  min_new_analysis: 3

# --- Чтение ---
# Дисциплина чтения держится на тех же двух приёмах, что дисциплина работы:
# лимит одновременного и старение начатого. Очередь не стареет — полка имеет
# право лежать годами. Свой потолок строк нужен, чтобы книги не выдавили из
# экрана обещания людям: чтение важно, но оно никому не обещано.
reading:
  wip_limit: 2            # сколько книг читаются одновременно
  top: 2                  # больше строк о чтении экран не покажет
  topic_similarity: 0.45  # порог «две полки об одном» — замечание линтера

# --- Ночь ---
# Из профиля (work/me/profil.md): ночью тревожное возбуждение выдаёт себя за
# ясность. Записи журнала в ночном окне поднимаются в экран одной строкой —
# не запрет, а пересмотр утром. Технические строки по расписанию («экран
# собран») ночной работой не считаются.
night:
  start: "23:00"
  end: "06:00"
  lookback_hours: 24
  ignore_markers: [экран собран]

# --- Наружу ---
# Слабейшая зона профиля — вывод результата из склада в мир: influence 1.0,
# «сделано, но не оформлено». Неделя без единого внешнего события — сигнал:
# работа копится в столе. Внешним считается встреча или интервью в raw/ либо
# строка журнала с одним из этих слов.
outbound:
  window_days: 7
  log_markers: [опубликовано, отправлено, проведена]

# --- Профиль ---
# Профиль (work/me/profil.md) — рабочие гипотезы о человеке, и калибруют их его
# поправки. Пересмотр привязан не к календарю, а к числу поводов: система
# ошиблась о человеке столько-то раз — значит её представление о нём устарело.
# Считаются поправки и отказы с даты последнего пересмотра (поле reviewed).
profile:
  path: work/me/profil.md
  refusals_before_review: 5

# Сколько кандидатов при разной ёмкости дня. Ёмкость — вход, а не допущение:
# полдня после трёх встреч и полдня утром — разные полдня.
capacity:
  full: 3
  half: 2
  low: 1

# --- Ситуативная политика ---
# Не меняет профиль и не ранжирует отдельные советы. Сначала решает, уместен ли
# сегодня весь класс: исследование, действие, решение, обучение, закрытие.
situational_policy:
  recent_research_days: 1          # сегодня и вчера — ещё один разбор может быть повтором
  promises_before_research_block: 2
  closure_window_days: 7
  closure_response_days: 3
  min_closure_samples: 3
  min_closure_rate: 0.5

# --- Вмешательства ---
# Attention находит проблему; этот слой решает, нужно ли беспокоить сейчас.
# Время и бюджет остаются настройками: обучение на истории сможет поменять их,
# не переписывая детекторы.
interventions:
  advance_hours: 24              # за сколько часов событие становится кандидатом
  response_hours: 24             # после какого молчания показ считается проигнорированным
  working_start: "09:00"
  working_end: "21:00"
  default_event_minutes: 60      # если календарь не прислал конец события
  default_task_minutes: 25       # минимальное окно для рабочего сигнала
  event_prep_minutes: 20         # минимальное окно подготовки к встрече
  max_output: 7
  optional_budget:               # право прервать необязательным сообщением за день
    full: 3
    half: 2
    low: 1
    unknown: 0

# --- TickTick ---
# Канал действия: склад знает, почему обязательство существует, приложение —
# что сделать сейчас. Список задаётся именем; пусто — берётся первый.
ticktick:
  project: Личное
