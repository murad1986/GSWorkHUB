# Правила проверки кода склада.
#
# Живут в проекте, а не в настройках машины: иначе один и тот же файл проходит
# проверку у одного и не проходит у другого, и «зелёные гейты» ничего не значат.
#
# Чего здесь сознательно нет:
#   DTZ — склад везде пишет местное время без часового пояса (generated_at в
#         wiki/attention.md, даты в шапках заметок). Время с поясом с ними не
#         сравнивается, требовать его — ломать сравнение.
#   RUF001-003 — кириллица в строках и комментариях считается «неоднозначными
#         символами». Здесь весь текст русский, это не находка, а шум.
#   EXE001 — инструменты запускаются через make, бит исполняемости не обязателен.

line-length = 110

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "UP", "ISC", "FURB"]

[lint.per-file-ignores]
# Проверка проверки нарочно ловит любое падение инструмента: смысл случая в том,
# что склад переживает битые данные, а не в том, каким классом он падает.
"tools/verify.py" = ["BLE001"]
